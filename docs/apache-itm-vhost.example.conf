# PROPUESTA NO INSTALADA. Incluir solo tras una autorización nueva.
# Conserva localhost y los Alias compartidos de Wamp para otros proyectos.
# Guardia global limitada al proyecto: evita el acceso alternativo /ITM/...
# desde localhost, su dirección IP u otro VirtualHost con DocumentRoot www.
<Directory "C:/wamp64/www/ITM">
    Options None
    AllowOverride None
    Require all denied
</Directory>

# Archivo encontrado por su nombre; no se inspeccionó su contenido.
# Bloquearlo expresamente sin borrar ni modificar el archivo.
<Directory "C:/wamp64/www">
    <Files "ITM.zip">
        Require all denied
    </Files>
</Directory>

<VirtualHost *:80>
    ServerName itm.test
    DocumentRoot "C:/wamp64/www/ITM/public"
    DirectoryIndex index.php
    ServerSignature Off

    <Directory "C:/wamp64/www/ITM/public">
        # Laravel requiere reescritura; sin Indexes, MultiViews, Includes o CGI.
        # FollowSymLinks mantiene el enlace public/storage existente.
        Options FollowSymLinks
        AllowOverride FileInfo Options=Indexes,MultiViews
        Require local
    </Directory>

    # No heredar acceso a herramientas de Wamp bajo el nombre de ITM.
    # Actualizar esta lista si se añaden nuevos Alias globales.
    <LocationMatch "(?i)^/(?:icons|adminer|phpmyadmin5\.2\.3|phpsysinfo|cgi-bin)(?:/|$)">
        Require all denied
    </LocationMatch>

    # Defensa adicional para nombres internos; no bloquear /storage: es el
    # enlace público existente, que todavía conserva documentos históricos.
    <LocationMatch "(?i)^/(?:vendor|bootstrap|database|app|tests|backups?)(?:/|$)">
        Require all denied
    </LocationMatch>
    <FilesMatch "(?i)(?:^\.|\.(?:sql|bak|backup|ini|conf|log)$)">
        Require all denied
    </FilesMatch>

    ErrorLog "C:/wamp64/logs/itm-error.log"
    CustomLog "C:/wamp64/logs/itm-access.log" common
</VirtualHost>
